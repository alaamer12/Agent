<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mockup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Only things Tailwind can't express directly go here: custom vars, keyframes, safe-area tweaks. */
    html { overscroll-behavior-y: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">

  <!-- Replace with the real screen content. Keep it a single .app container sized for the target viewport
       (see references/viewport-frames.md for widths). No device bezels/browser chrome — frameless. -->
  <div class="app max-w-md mx-auto min-h-screen bg-white">

    <!-- Example: a trigger that opens a bottom sheet -->
    <button onclick="openSheet('example')" class="m-4 px-4 py-2 rounded-lg bg-slate-900 text-white text-sm">
      Open sheet
    </button>

  </div>

  <!-- Example bottom sheet + backdrop, follow this pattern for every sheet/drawer/modal on the screen -->
  <div id="sheet-backdrop" class="fixed inset-0 bg-black/40 opacity-0 pointer-events-none transition-opacity duration-200"
       onclick="closeSheet()"></div>
  <div id="sheet-example"
       class="fixed left-1/2 bottom-0 w-full max-w-md -translate-x-1/2 translate-y-full bg-white rounded-t-2xl transition-transform duration-200 bottom-sheet">
    <div class="flex justify-center py-2"><div class="w-9 h-1.5 rounded-full bg-slate-300"></div></div>
    <div class="px-5 pb-8">
      <h3 class="text-base font-bold mb-2">Example sheet</h3>
      <p class="text-sm text-slate-500">Replace with real content.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    // --- reusable open/close fns — wire these to both onclick handlers AND the query-param bootstrap below ---
    function openSheet(id) {
      document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('translate-y-0'));
      document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.add('translate-y-full'));
      document.getElementById('sheet-backdrop')?.classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById(`sheet-${id}`)?.classList.remove('translate-y-full');
      document.getElementById(`sheet-${id}`)?.classList.add('translate-y-0');
    }
    function closeSheet() {
      document.querySelectorAll('.bottom-sheet').forEach(el => {
        el.classList.remove('translate-y-0');
        el.classList.add('translate-y-full');
      });
      document.getElementById('sheet-backdrop')?.classList.add('opacity-0', 'pointer-events-none');
    }

    // --- bootstrap: apply query params on load using the SAME fns as clicks ---
    function applyInitialState() {
      const sheet = params.get('sheet');
      if (sheet) openSheet(sheet);
      // Add the same pattern for drawer/modal/tab/accordion/step/toast params as the screen needs.
      // See references/query-param-states.md for each component type's pattern.
    }
    applyInitialState();
  </script>
</body>
</html>
