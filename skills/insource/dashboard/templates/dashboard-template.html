<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview - Workspace Console</title>

  <!--
    Reusable Dashboard Starter Template
    Note: All route labels, metrics, entity names, and sample series below are fictional demo data.
    Customize :root palette tokens and main section components freely for your domain.
  -->

  <!-- Fonts: Plus Jakarta Sans (UI) & JetBrains Mono (Metrics/Slugs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Core Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.0/dist/apexcharts.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <style>
    /* =========================================================================
       DESIGN TOKENS - 4-Tier Zero-Glare Tonal Ramp (Swap Hue Family Freely)
       ========================================================================= */
    :root {
      /* Sidebar Rail */
      --rail-bg: #15333E;
      --rail-border: rgba(223, 236, 239, 0.09);
      --rail-ink: #DFECEF;
      --rail-group-ink: #8FAFB8;
      --rail-hover-bg: rgba(223, 236, 239, 0.08);
      --rail-pressed-bg: rgba(223, 236, 239, 0.14);
      --rail-active-bg: #234E5D;
      --rail-active-ink: #F2F9FA;
      --rail-active-icon: #7ED4E2;

      /* 4-Tier Surface Ramp */
      --canvas-bg: #EAF1F3;
      --surface-bg: #F6FAFB;
      --surface-border: rgba(21, 52, 62, 0.08);
      --surface-shadow: 0 2px 10px rgba(21, 52, 62, 0.04);

      --zone-bg: #E2ECEF;
      --zone-inner: #EEF5F7;
      --chart-surface: #F9FCFD;
      --skel-bar: #D3E1E5;
      --skel-bar-soft: #DAE6EA;

      /* Typography Ink */
      --ink-primary: #16323B;
      --ink-secondary: #46636C;

      /* Brand Accent & Focus */
      --accent: #1C6B7C;
      --accent-hover: #155766;
      --accent-pressed: #104552;
      --accent-soft: rgba(28, 107, 124, 0.12);
      --focus-ring: #56B4C4;

      /* Semantic Status */
      --status-ok: #2B7A5B;
      --status-ok-bg: rgba(43, 122, 91, 0.12);
      --status-warn: #B76E22;
      --status-warn-bg: rgba(183, 110, 34, 0.12);
      --status-danger: #B54545;
      --status-danger-bg: rgba(181, 69, 69, 0.12);

      /* Layout & Radii */
      --rail-width: 280px;
      --rail-collapsed: 76px;
      --topbar-height: 68px;
      --r-btn: 10px;
      --r-pill: 12px;
      --r-zone: 16px;
      --r-surface: 18px;

      /* Motion & Easing */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --t-ui: 160ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--canvas-bg);
      color: var(--ink-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .font-mono-slug {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(21, 52, 62, 0.18); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(21, 52, 62, 0.3); }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 14px;
      z-index: 100;
      padding: 10px 16px;
      border-radius: var(--r-btn);
      background-color: var(--accent);
      color: var(--rail-active-ink);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transform: translateY(-160%);
      transition: transform var(--t-ui) var(--ease-out);
    }
    .skip-link:focus { transform: translateY(0); }

    /* =========================================================================
       APPLICATION SHELL - COLLAPSIBLE SIDEBAR & WORK AREA
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .sidebar-rail {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      width: var(--rail-width);
      background-color: var(--rail-bg);
      color: var(--rail-ink);
      border-right: 1px solid var(--rail-border);
      display: flex;
      flex-direction: column;
      transition: width var(--t-ui) var(--ease-out), transform var(--t-ui) var(--ease-out);
      user-select: none;
    }

    .app-shell.is-collapsed .sidebar-rail {
      width: var(--rail-collapsed);
    }

    .rail-header {
      height: var(--topbar-height);
      padding: 0 16px 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--rail-border);
      flex-shrink: 0;
    }

    .app-shell.is-collapsed .rail-header {
      padding: 0;
      justify-content: center;
    }

    .brand-wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--rail-active-ink);
    }

    .brand-role {
      font-size: 13px;
      font-weight: 600;
      color: var(--rail-group-ink);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      flex-shrink: 0;
      background-color: #3DD6B5;
      box-shadow: 0 0 0 3px rgba(61, 214, 181, 0.2);
      transition: background-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
    }

    .brand-dot.is-paused {
      background-color: #E5A93C;
      box-shadow: 0 0 0 3px rgba(229, 169, 60, 0.22);
    }

    .app-shell.is-collapsed .brand-wordmark {
      display: none;
    }

    .rail-icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: var(--r-btn);
      background: transparent;
      color: var(--rail-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out);
    }

    .rail-icon-btn:hover {
      background-color: var(--rail-hover-bg);
      color: var(--rail-active-ink);
    }

    .rail-icon-btn:active {
      background-color: var(--rail-pressed-bg);
    }

    .rail-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: visible;
      padding: 16px 14px 24px;
      scrollbar-width: thin;
      scrollbar-color: rgba(223, 236, 239, 0.2) transparent;
    }

    .app-shell.is-collapsed .rail-nav {
      overflow-y: visible;
      padding: 16px 12px 24px;
    }

    .nav-group { margin-bottom: 20px; }
    .nav-group:last-child { margin-bottom: 0; }

    .nav-group-label {
      padding: 0 12px 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--rail-group-ink);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .app-shell.is-collapsed .nav-group-label {
      height: 1px;
      padding: 0;
      margin: 10px 10px;
      background-color: var(--rail-border);
      font-size: 0;
      color: transparent;
    }

    .app-shell.is-collapsed .nav-group:first-child .nav-group-label {
      display: none;
    }

    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item { position: relative; }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--rail-ink);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      padding: 10px 14px;
      border-radius: var(--r-pill);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out);
    }

    .nav-btn:hover {
      background-color: var(--rail-hover-bg);
      color: var(--rail-active-ink);
    }

    .nav-btn:active {
      background-color: var(--rail-pressed-bg);
    }

    .nav-btn[aria-current="page"] {
      background-color: var(--rail-active-bg);
      color: var(--rail-active-ink);
      font-weight: 700;
    }

    .nav-btn svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      color: var(--rail-group-ink);
      transition: color var(--t-ui) var(--ease-out);
    }

    .nav-btn:hover svg { color: var(--rail-ink); }
    .nav-btn[aria-current="page"] svg { color: var(--rail-active-icon); }

    .nav-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-shell.is-collapsed .nav-btn {
      justify-content: center;
      padding: 11px 0;
    }

    .app-shell.is-collapsed .nav-label {
      position: absolute;
      left: calc(100% + 14px);
      top: 50%;
      transform: translateY(-50%);
      background-color: #102932;
      color: var(--rail-active-ink);
      font-size: 13.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--r-btn);
      border: 1px solid var(--rail-border);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      z-index: 60;
      transition: opacity var(--t-ui) var(--ease-out);
    }

    .app-shell.is-collapsed .nav-btn:hover .nav-label,
    .app-shell.is-collapsed .nav-btn:focus-visible .nav-label {
      opacity: 1;
      visibility: visible;
    }

    /* =========================================================================
       WORK AREA & TOP BAR
       ========================================================================= */
    .work-area {
      flex: 1;
      min-width: 0;
      margin-left: var(--rail-width);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left var(--t-ui) var(--ease-out);
    }

    .app-shell.is-collapsed .work-area {
      margin-left: var(--rail-collapsed);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--topbar-height);
      background-color: var(--canvas-bg);
      border-bottom: 1px solid var(--surface-border);
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: var(--r-btn);
      border: 1px solid var(--surface-border);
      background-color: var(--surface-bg);
      color: var(--ink-primary);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .route-slug {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background-color: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: 99px;
      padding: 5px 10px 5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background-color: var(--status-ok);
    }

    .sync-dot.is-paused {
      background-color: var(--status-warn);
    }

    .sync-refresh-btn {
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      width: 22px;
      height: 22px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out);
    }

    .sync-refresh-btn:hover {
      background-color: var(--zone-bg);
      color: var(--accent);
    }

    .state-switcher {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      background-color: var(--zone-bg);
      border-radius: var(--r-pill);
      gap: 4px;
      flex-shrink: 0;
    }

    .state-btn {
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out);
    }

    .state-btn:hover {
      color: var(--ink-primary);
      background-color: rgba(246, 250, 251, 0.55);
    }

    .state-btn[aria-pressed="true"] {
      background-color: var(--surface-bg);
      color: var(--accent);
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(21, 52, 62, 0.08);
    }

    /* =========================================================================
       PAGE SURFACE, 1-COL ZONES, CHART SURFACES & UI ELEMENTS
       ========================================================================= */
    .page-canvas {
      flex: 1;
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 28px 36px 52px;
    }

    .page-surface {
      background-color: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: var(--r-surface);
      box-shadow: var(--surface-shadow);
      padding: 32px 34px 36px;
    }

    .page-header {
      margin-bottom: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .page-title {
      margin: 0 0 6px;
      font-size: clamp(24px, 2.2vw, 28px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.025em;
      color: var(--ink-primary);
    }

    .page-subtitle {
      margin: 0;
      max-width: 74ch;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--ink-secondary);
    }

    .page-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      width: 100%;
    }

    .wf-zone {
      background-color: var(--zone-bg);
      border-radius: var(--r-zone);
      padding: 28px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .wf-zone-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .wf-zone-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wf-zone-sub {
      margin: 3px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-secondary);
    }

    .chart-surface {
      background-color: var(--chart-surface);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 20px 24px;
      width: 100%;
    }

    .data-card {
      background-color: var(--chart-surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-ok { background-color: var(--status-ok-bg); color: var(--status-ok); }
    .badge-warn { background-color: var(--status-warn-bg); color: var(--status-warn); }
    .badge-danger { background-color: var(--status-danger-bg); color: var(--status-danger); }
    .badge-accent { background-color: var(--accent-soft); color: var(--accent); }
    .badge-neutral { background-color: rgba(21, 52, 62, 0.08); color: var(--ink-secondary); }

    /* Buttons & Inputs */
    .btn-primary {
      border: 0;
      border-radius: var(--r-btn);
      background-color: var(--accent);
      color: var(--rail-active-ink);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 9px 16px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: background-color var(--t-ui) var(--ease-out);
    }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-primary:active { background-color: var(--accent-pressed); }

    .btn-soft {
      border: 1px solid var(--surface-border);
      border-radius: var(--r-btn);
      background-color: var(--chart-surface);
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out), border-color var(--t-ui) var(--ease-out);
    }
    .btn-soft:hover {
      background-color: var(--zone-inner);
      color: var(--accent);
      border-color: rgba(28, 107, 124, 0.25);
    }
    .btn-soft.is-active {
      background-color: var(--accent);
      color: var(--rail-active-ink);
      border-color: var(--accent);
    }

    .input-calm {
      background-color: var(--chart-surface);
      border: 1px solid rgba(21, 52, 62, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink-primary);
      outline: none;
      transition: border-color var(--t-ui) var(--ease-out);
    }
    .input-calm:focus { border-color: var(--accent); }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background-color: var(--chart-surface);
      border-radius: 14px;
      border: 1px solid var(--surface-border);
    }

    .calm-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    .calm-table th {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-secondary);
      border-bottom: 1px solid var(--surface-border);
      background-color: var(--zone-inner);
      white-space: nowrap;
    }

    .calm-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--surface-border);
      color: var(--ink-primary);
      vertical-align: middle;
    }

    .calm-table tbody tr:last-child td { border-bottom: 0; }
    .calm-table tbody tr:hover { background-color: rgba(226, 236, 239, 0.35); }
    .calm-table-fixed { table-layout: fixed; }

    .cell-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      max-width: 100%;
    }

    .cell-truncate {
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell-truncate-title {
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink-primary);
    }

    .cell-truncate-meta {
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--ink-secondary);
    }

    [data-tooltip] { cursor: help; }
    [data-tooltip]:hover {
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-color: rgba(28, 107, 124, 0.55);
      text-underline-offset: 3px;
    }

    /* Global Non-Clipping Floating Tooltip */
    .global-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      pointer-events: none;
      background-color: #102932;
      color: #F2F9FA;
      border: 1px solid rgba(223, 236, 239, 0.14);
      border-radius: 10px;
      padding: 10px 14px;
      max-width: 380px;
      box-shadow: 0 10px 28px rgba(15, 35, 43, 0.22);
      font-size: 13px;
      line-height: 1.55;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity 140ms var(--ease-out), transform 140ms var(--ease-out), visibility 140ms;
    }

    .global-tooltip.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .global-tooltip-main {
      font-weight: 600;
      color: #F2F9FA;
      word-break: break-word;
    }

    .global-tooltip-sub {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid rgba(223, 236, 239, 0.12);
      font-size: 12px;
      font-weight: 500;
      color: #9CC2CC;
      word-break: break-word;
    }

    /* Empty & Loading States */
    .empty-panel {
      background-color: var(--zone-bg);
      border-radius: var(--r-zone);
      padding: 56px 32px;
      display: flex;

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background-color: rgba(16, 40, 48, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 160ms var(--ease-out);
    }

    .modal-card {
      background-color: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      max-width: 620px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(15, 38, 46, 0.25);
      animation: modalIn 180ms var(--ease-out);
    }

    .toast-container {
      position: fixed;
      bottom: 22px;
      right: 24px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast-item {
      pointer-events: auto;
      background-color: var(--rail-bg);
      color: var(--rail-active-ink);
      border: 1px solid rgba(126, 212, 226, 0.28);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(15, 38, 46, 0.22);
      animation: toastIn 200ms var(--ease-out);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 35;
      background-color: rgba(16, 40, 48, 0.38);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--t-ui) var(--ease-out), visibility var(--t-ui) var(--ease-out);
    }
    .drawer-backdrop.is-open { opacity: 1; visibility: visible; }
    .mobile-close-btn { display: none; }

    @media (max-width: 959px) {
      .sidebar-rail { width: var(--rail-width) !important; transform: translateX(-100%); }
      .app-shell.is-mobile-open .sidebar-rail { transform: translateX(0); }
      .work-area, .app-shell.is-collapsed .work-area { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }

      .mobile-close-btn { display: inline-flex; }
      .app-shell.is-collapsed .brand-wordmark { display: flex; }
      .app-shell.is-collapsed .rail-header { padding: 0 16px 0 22px; justify-content: space-between; }
      .app-shell.is-collapsed .nav-btn { justify-content: flex-start; padding: 10px 14px; }
      .app-shell.is-collapsed .nav-label {
        position: static; transform: none; background: transparent; border: 0;

      .app-shell.is-collapsed .nav-group-label {

    @media (prefers-reduced-motion: reduce) {

        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

        }
      ];

      /* =======================================================================
         DOM REFERENCES
         ======================================================================= */
      const appShell = document.getElementById('app-shell');
      const railNav = document.getElementById('rail-nav');
      const mainContent = document.getElementById('main-content');
      const topbarRouteSlug = document.getElementById('topbar-route-slug');
      const syncStatusText = document.getElementById('sync-status-text');
      const topbarSyncDot = document.getElementById('topbar-sync-dot');
      const sidebarStatusDot = document.getElementById('sidebar-status-dot');
      const refreshDataBtn = document.getElementById('refresh-data-btn');
      const collapseBtn = document.getElementById('collapse-rail-btn');
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const mobileCloseBtn = document.getElementById('mobile-close-btn');

      const srAnnouncer = document.getElementById('sr-announcer');
      const modalRoot = document.getElementById('modal-root');

      const stateButtons = Array.from(document.querySelectorAll('.state-btn'));

      /* =======================================================================
         UTILITY & CHART LIFECYCLE HELPERS
         ======================================================================= */
      function esc(val) {
        return String(val === undefined || val === null ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function prefersReducedMotion() {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {

        }
      }

      function destroyCharts() {
        activeCharts.forEach(function (c) {
          try { c.destroy(); } catch (_) {}
        });
        activeCharts = [];
      }

      function mountChart(selector, config) {
        const el = typeof selector === 'string' ? document.querySelector(selector) : selector;
        if (!el) return null;

        if (typeof ApexCharts === 'undefined') {
          el.innerHTML = '<div class="py-12 px-6 text-center text-sm text-[#46636C]">Chart library unavailable offline.</div>';
          return null;
        }

        try {
          el.innerHTML = '';
          const chart = new ApexCharts(el, config);
          chart.render();
          activeCharts.push(chart);
          return chart;
        } catch (err) {
          el.innerHTML = '<div class="py-10 px-6 text-center text-xs font-mono-slug text-[#B54545]">Chart error: ' + esc(err && err.message ? err.message : 'Unknown') + '</div>';
          return null;
        }
      }

      /* Shared ApexCharts motion & visual defaults */

          },

          },

            theme: 'light',
            style: { fontSize: '12.5px', fontFamily: 'Plus Jakarta Sans, sans-serif' }
          }
        };
      }

      function showToast(message) {

        toastContainer.appendChild(item);
        refreshIcons();
        setTimeout(function () {
          item.style.opacity = '0';
          item.style.transition = 'opacity 180ms ease';
          setTimeout(function () {
            if (item.parentNode) item.parentNode.removeChild(item);
          }, 200);
        }, 3000);
      }

      function announce(msg) {
        if (!srAnnouncer) return;
        srAnnouncer.textContent = '';
        window.requestAnimationFrame(function () {
          srAnnouncer.textContent = msg;
        });

      function updateStatusIndicators() {
        const paused = state.streamPaused;
        if (syncStatusText) syncStatusText.textContent = paused ? 'Paused' : 'Live · Synced';

        if (sidebarStatusDot) sidebarStatusDot.classList.toggle('is-paused', paused);
      }

      function downloadCsv(filename, headers, rows) {
        try {
          const lines = [
            headers.join(','),
            ...rows.map(function (r) {
              return r.map(function (cell) {
                return '"' + String(cell).replace(/"/g, '""') + '"';
              }).join(',');
            })
          ];
          const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', filename);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (_) {
          showToast('CSV export prepared (' + rows.length + ' rows)');
        }
      }

      function openModal(html) {
        if (!modalRoot) return;
        modalRoot.innerHTML = '<div class="modal-backdrop" id="active-modal-backdrop" role="dialog" aria-modal="true"><div class="modal-card">' + html + '</div></div>';

        const bd = document.getElementById('active-modal-backdrop');
        if (bd) {
          bd.addEventListener('click', function (e) {
            if (e.target === bd) closeModal();
          });
        }
        const closeBtn = modalRoot.querySelector('[data-close-modal]');
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
      }

      function closeModal() {

      /* =======================================================================
         GLOBAL NON-CLIPPING FLOATING TOOLTIP (#global-tooltip)
         ======================================================================= */
      let activeTooltipEl = null;

      function positionGlobalTooltip(target) {
        const tip = document.getElementById('global-tooltip');
        if (!tip || !target) return;
        const rect = target.getBoundingClientRect();
        const tipRect = tip.getBoundingClientRect();
        const pad = 12;

        let left = rect.left + rect.width / 2 - tipRect.width / 2;
        left = Math.max(pad, Math.min(window.innerWidth - tipRect.width - pad, left));

        let top = rect.top - tipRect.height - 10;
        if (top < pad) top = rect.bottom + 10;
        if (top + tipRect.height > window.innerHeight - pad) {
          top = Math.max(pad, window.innerHeight - tipRect.height - pad);
        }

        tip.style.left = Math.round(left) + 'px';
        tip.style.top = Math.round(top) + 'px';
      }

      function showGlobalTooltip(target) {
        const tip = document.getElementById('global-tooltip');
        if (!tip || !target) return;
        const mainText = target.getAttribute('data-tooltip');
        if (!mainText) return;
        const subText = target.getAttribute('data-tooltip-sub');

        activeTooltipEl = target;
        tip.innerHTML =
          '<div class="global-tooltip-main">' + esc(mainText) + '</div>' +
          (subText ? '<div class="global-tooltip-sub">' + esc(subText) + '</div>' : '');

        tip.classList.add('is-visible');
        tip.setAttribute('aria-hidden', 'false');
        positionGlobalTooltip(target);
      }

      function hideGlobalTooltip() {
        const tip = document.getElementById('global-tooltip');
        activeTooltipEl = null;
        if (!tip) return;
        tip.classList.remove('is-visible');
        tip.setAttribute('aria-hidden', 'true');
      }

      function initGlobalTooltip() {
        document.addEventListener('mouseover', function (e) {
          const target = e.target.closest('[data-tooltip]');
          if (target) showGlobalTooltip(target);
          else if (activeTooltipEl) hideGlobalTooltip();
        });
        document.addEventListener('mouseout', function (e) {
          if (!activeTooltipEl) return;
          const related = e.relatedTarget;
          if (!related || !activeTooltipEl.contains(related)) hideGlobalTooltip();
        });
        document.addEventListener('focusin', function (e) {
          const target = e.target.closest('[data-tooltip]');
          if (target) showGlobalTooltip(target);
        });
        document.addEventListener('focusout', hideGlobalTooltip);
        window.addEventListener('scroll', hideGlobalTooltip, true);
        window.addEventListener('resize', hideGlobalTooltip);
      }

      function renderLoadingState(routeTitle) {

      function initActivityCharts() {
        const days = ['Sun', 'Sat', 'Fri', 'Thu', 'Wed', 'Tue', 'Mon'];
        const series = days.map(function (day, dIdx) {
          const weekend = day === 'Sat' || day === 'Sun';
          const row = [];
          for (let h = 0; h < 24; h++) {
            const wave = Math.sin(((h - 7) / 24) * Math.PI * 2);
            const val = state.heatmapLayer === 'volume'
              ? Math.max(2, Math.round((weekend ? 10 : 19) + wave * 11 + ((dIdx * 3 + h) % 5)))
              : Math.max(90, Math.round((weekend ? 180 : 265) + wave * 85 + ((dIdx * 11 + h * 5) % 30)));
            row.push({ x: (h < 10 ? '0' + h : '' + h) + 'h', y: val });
          }
          return { name: day, data: row };
        });

        const ranges = state.heatmapLayer === 'value'
          ? [
              { from: 0, to: 170, color: '#DAE8EC', name: '<$170' },
              { from: 171, to: 250, color: '#97C8D4', name: '$171-250' },
              { from: 251, to: 330, color: '#398C9E', name: '$251-330' },
              { from: 331, to: 480, color: '#15333E', name: '$331+' }
            ]
          : [
              { from: 0, to: 10, color: '#DAE8EC', name: 'Quiet' },
              { from: 11, to: 20, color: '#97C8D4', name: 'Moderate' },
              { from: 21, to: 28, color: '#398C9E', name: 'Busy' },
              { from: 29, to: 45, color: '#15333E', name: 'Peak' }
            ];

        const base = baseChartOpts(320);
        mountChart('#chart-activity-heatmap', {
          chart: Object.assign({}, base.chart, { type: 'heatmap' }),
          grid: base.grid,
          dataLabels: { enabled: false },
          legend: base.legend,
          tooltip: base.tooltip,
          plotOptions: { heatmap: { radius: 4, shadeIntensity: 0.3, colorScale: { ranges: ranges } } },
          series: series,
          xaxis: { labels: { style: { fontSize: '11px', colors: '#46636C' } } }
        });

        document.querySelectorAll('.hm-layer-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.heatmapLayer = btn.dataset.layer;
            renderPage();
          });
        });

        const slider = document.getElementById('priority-slider');
        if (slider) {
          slider.addEventListener('input', function (e) {
            state.minPriority = Number(e.target.value);
            renderPage();
          });
        }

        document.querySelectorAll('.inspect-item-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = Number(btn.dataset.itemId);
            const item = QUEUE_ITEMS_DEMO.find(function (x) { return x.id === id; });
            if (!item) return;
            openModal(
              '<div class="flex items-start justify-between gap-4 mb-4">' +

                  '<span class="badge badge-ok font-mono-slug mb-2">Score ' + item.score + '/100 · ' + esc(item.status) + '</span>' +
                  '<h3 class="text-lg font-extrabold text-[#16323B] m-0">' + esc(item.title) + '</h3>' +
                  '<p class="text-xs text-[#46636C] mt-1 mb-0">#' + item.id + ' · ' + esc(item.owner) + '</p>' +

              '<div class="flex justify-end"><button type="button" class="btn-primary" data-close-modal>Close</button></div>'

                '<div>' +
                  '<h2 class="wf-zone-title">Runtime Configuration</h2>' +
                  '<p class="wf-zone-sub">Adjust polling intervals, concurrency limits, and stream pause state</p>' +
                '</div>' +
                '<div class="flex flex-wrap gap-2">' +
                  '<button id="toggle-stream-btn" type="button" class="btn-soft">' +
                    '<i data-lucide="' + (state.streamPaused ? 'play' : 'pause') + '" class="w-4 h-4"></i>' +
                    (state.streamPaused ? 'Resume Stream' : 'Pause Stream') +
                  '</button>' +
                  '<button id="save-settings-btn" type="button" class="btn-primary"><i data-lucide="save" class="w-4 h-4"></i> Save Changes</button>' +
                '</div>' +
              '</div>' +
              '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">' +
                '<div class="data-card"><label class="block text-xs font-bold text-[#46636C] mb-1.5">Refresh Interval (sec)</label><input id="set-refresh" type="number" value="' + s.refreshSec + '" class="input-calm w-full font-mono-slug" /></div>' +
                '<div class="data-card"><label class="block text-xs font-bold text-[#46636C] mb-1.5">Worker Concurrency</label><input id="set-concurrency" type="number" value="' + s.concurrency + '" class="input-calm w-full font-mono-slug" /></div>' +
                '<div class="data-card"><label class="block text-xs font-bold text-[#46636C] mb-1.5">Alert Score Threshold</label><input id="set-threshold" type="number" value="' + s.alertThreshold + '" class="input-calm w-full font-mono-slug" /></div>' +
                '<div class="data-card"><label class="block text-xs font-bold text-[#46636C] mb-1.5">Archive Retention (days)</label><input id="set-retention" type="number" value="' + s.retentionDays + '" class="input-calm w-full font-mono-slug" /></div>' +
              '</div>' +
            '</section>' +
          '</div>'
        );
      }

      function initSettingsPage() {
        const toggleBtn = document.getElementById('toggle-stream-btn');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', function () {
            state.streamPaused = !state.streamPaused;
            updateStatusIndicators();
            renderPage();
            showToast(state.streamPaused ? 'Background stream paused.' : 'Background stream resumed.');
          });
        }
        const saveBtn = document.getElementById('save-settings-btn');
        if (saveBtn) {
          saveBtn.addEventListener('click', function () {
            state.settings.refreshSec = Number(document.getElementById('set-refresh').value) || 60;
            state.settings.concurrency = Number(document.getElementById('set-concurrency').value) || 8;
            state.settings.alertThreshold = Number(document.getElementById('set-threshold').value) || 85;
            state.settings.retentionDays = Number(document.getElementById('set-retention').value) || 90;
            showToast('Configuration saved.');
          });
        }
      }

      /* =======================================================================
         PAGE DISPATCHER & SHELL INTERACTIONS
         ======================================================================= */
      const PAGE_HANDLERS = {
        '/dashboard/overview': { render: renderOverviewPage, init: initOverviewCharts },
        '/dashboard/trends': { render: renderTrendsPage, init: initTrendsCharts },
        '/dashboard/activity': { render: renderActivityPage, init: initActivityCharts },
        '/dashboard/settings': { render: renderSettingsPage, init: initSettingsPage }
      };

      function renderPage() {
        destroyCharts();
        closeModal();

        const route = ROUTE_MAP.get(state.activePath) || ROUTE_MAP.get(DEFAULT_ROUTE);
        if (topbarRouteSlug) topbarRouteSlug.textContent = route.path;
        document.title = route.title + ' - Workspace Console';

        railNav.querySelectorAll('.nav-btn').forEach(function (btn) {
          btn.setAttribute('aria-current', btn.dataset.route === route.path ? 'page' : 'false');
        });
        stateButtons.forEach(function (btn) {
          btn.setAttribute('aria-pressed', btn.dataset.state === state.previewMode ? 'true' : 'false');
        });

        let bodyHtml = '';
        if (state.previewMode === 'empty') bodyHtml = renderEmptyState(route);
        else if (state.previewMode === 'loading') bodyHtml = renderLoadingState(route.title);
        else {
          const handler = PAGE_HANDLERS[route.path] || PAGE_HANDLERS[DEFAULT_ROUTE];
          bodyHtml = handler.render();
        }

        mainContent.innerHTML =
          '<div class="page-surface">' +
            '<header class="page-header">' +
              '<div>' +
                '<h1 class="page-title">' + esc(route.title) + '</h1>' +
                '<p class="page-subtitle">' + esc(route.subtitle) + '</p>' +
              '</div>' +
            '</header>' +
            bodyHtml +
          '</div>';

        refreshIcons();

        if (state.previewMode === 'empty') {
          const emptyBtn = document.getElementById('empty-primary-action');
          if (emptyBtn) {
            emptyBtn.addEventListener('click', function () {
              const target = emptyBtn.dataset.targetRoute;
              state.previewMode = 'production';
              if (target && ROUTE_MAP.has(target)) navigateTo(target, true);
              else renderPage();
            });
          }
        } else if (state.previewMode === 'production') {
          const handler = PAGE_HANDLERS[route.path] || PAGE_HANDLERS[DEFAULT_ROUTE];
          if (handler && typeof handler.init === 'function') handler.init();
        }
      }

      function parseHashRoute() {
        try {
          const raw = window.location.hash.replace(/^#/, '').trim();
          if (raw && ROUTE_MAP.has(raw)) return raw;
        } catch (_) {}
        return DEFAULT_ROUTE;
      }

      function navigateTo(path, updateHash) {
        const target = ROUTE_MAP.has(path) ? path : DEFAULT_ROUTE;
        state.activePath = target;
        if (updateHash) {
          try {
            const nextHash = '#' + target;
            if (window.location.hash !== nextHash) window.location.hash = nextHash;
          } catch (_) {}
        }
        renderPage();
        closeMobileDrawer(false);
        announce('Opened ' + ROUTE_MAP.get(target).title);
      }

      function setPreviewMode(mode) {
        if (['production', 'empty', 'loading'].indexOf(mode) === -1) return;
        state.previewMode = mode;
        renderPage();
        announce('Preview mode switched to ' + mode);
      }

      function toggleDesktopCollapse() {
        state.isCollapsed = !state.isCollapsed;
        appShell.classList.toggle('is-collapsed', state.isCollapsed);
        collapseBtn.setAttribute('aria-expanded', String(!state.isCollapsed));
        collapseBtn.setAttribute('title', state.isCollapsed ? 'Expand sidebar' : 'Collapse sidebar');
        collapseBtn.innerHTML = '<i data-lucide="' + (state.isCollapsed ? 'panel-left-open' : 'panel-left-close') + '" class="w-5 h-5"></i>';
        refreshIcons();
        /* Reflow charts smoothly right after the 160ms rail transition settles */
        setTimeout(function () {
          window.dispatchEvent(new Event('resize'));
        }, 200);
      }

      function openMobileDrawer() {
        state.isMobileOpen = true;
        appShell.classList.add('is-mobile-open');
        drawerBackdrop.classList.add('is-open');
        drawerBackdrop.setAttribute('aria-hidden', 'false');
        mobileMenuBtn.setAttribute('aria-expanded', 'true');
        mobileCloseBtn.focus();
      }

      function closeMobileDrawer(restoreFocus) {
        if (!state.isMobileOpen) return;
        state.isMobileOpen = false;
        appShell.classList.remove('is-mobile-open');
        drawerBackdrop.classList.remove('is-open');
        drawerBackdrop.setAttribute('aria-hidden', 'true');
        mobileMenuBtn.setAttribute('aria-expanded', 'false');
        if (restoreFocus && mobileMenuBtn) mobileMenuBtn.focus();
      }

      function bindEvents() {
        railNav.addEventListener('click', function (e) {
          const btn = e.target.closest('.nav-btn');
          if (btn && btn.dataset.route) navigateTo(btn.dataset.route, true);
        });

        railNav.addEventListener('keydown', function (e) {
          if (['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(e.key) === -1) return;
          const buttons = Array.from(railNav.querySelectorAll('.nav-btn'));
          const idx = buttons.indexOf(document.activeElement);
          if (idx === -1) return;
          e.preventDefault();
          let next = idx;
          if (e.key === 'ArrowDown') next = (idx + 1) % buttons.length;
          else if (e.key === 'ArrowUp') next = (idx - 1 + buttons.length) % buttons.length;
          else if (e.key === 'Home') next = 0;
          else if (e.key === 'End') next = buttons.length - 1;
          buttons[next].focus();
        });

        stateButtons.forEach(function (btn) {
          btn.addEventListener('click', function () { setPreviewMode(btn.dataset.state); });
        });

        if (refreshDataBtn) {
          refreshDataBtn.addEventListener('click', function () {
            showToast('Metrics refreshed.');
            renderPage();
          });
        }

        if (collapseBtn) collapseBtn.addEventListener('click', toggleDesktopCollapse);
        if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', openMobileDrawer);
        if (mobileCloseBtn) mobileCloseBtn.addEventListener('click', function () { closeMobileDrawer(true); });
        if (drawerBackdrop) drawerBackdrop.addEventListener('click', function () { closeMobileDrawer(true); });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            if (modalRoot && modalRoot.innerHTML) closeModal();
            else if (state.isMobileOpen) closeMobileDrawer(true);
          }
        });

        window.addEventListener('hashchange', function () {
          const nextRoute = parseHashRoute();
          if (nextRoute !== state.activePath) navigateTo(nextRoute, false);
        });

        window.addEventListener('resize', function () {
          if (window.innerWidth >= 960 && state.isMobileOpen) closeMobileDrawer(false);
        });
      }

      function init() {
        state.activePath = parseHashRoute();
        renderSidebar();
        updateStatusIndicators();
        initGlobalTooltip();
        bindEvents();
        renderPage();
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
</body>
</html>
