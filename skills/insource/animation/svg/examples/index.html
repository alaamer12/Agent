<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SVG Logo Animation v3 — 90 Worked Examples (100-Style Battery)</title>
  <style>
    :root { --bg: #f4f6f8; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --accent: #0494a4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header {
      position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
    input[type="search"] {
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; width: 160px;
    }
    button {
      border: 1px solid var(--border); background: #fff; color: var(--text);
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px; padding: 20px; max-width: 1700px; margin: 0 auto;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .stage {
      min-height: 150px; display: flex; align-items: center; justify-content: center;
      padding: 20px; overflow: auto; transition: background 0.15s;
    }
    body[data-stage="light"] .stage { background: #ffffff; }
    body[data-stage="dark"] .stage { background: #0a0a12; }
    body[data-stage="check"] .stage {
      background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
                        linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
                        linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #f8fafc;
    }
    .stage img { display: block; transform-origin: center; }
    .meta {
      padding: 10px 14px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; font-weight: 700; text-transform: uppercase; }
    .badge.v1 { background: #e2e8f0; color: #334155; }
    .badge.v2 { background: #ccfbf1; color: #0f766e; }
    .badge.v3 { background: #dbeafe; color: #1d4ed8; }
  </style>
</head>
<body data-stage="light">
  <header>
    <h1>SVG Animation Battery v3 · 90 Worked Examples (100 Styles)</h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search style name..." />
      <button class="filter-btn active" data-filter="all">All (90)</button>
      <button class="filter-btn" data-filter="v3">New v3 (50)</button>
      <button class="filter-btn" data-filter="v2">v2 (25)</button>
      <button class="filter-btn" data-filter="v1">v1 (15)</button>
      <span>Stage:</span>
      <button class="stage-btn active" data-stage="light">Light</button>
      <button class="stage-btn" data-stage="dark">Dark</button>
      <button class="stage-btn" data-stage="check">Check</button>
      <label>Zoom: <input id="zoom" type="range" min="1" max="2.5" step="0.25" value="1" /> <span id="zval">1×</span></label>
      <button id="replay-all">Replay All</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
  <script>
    const ITEMS = [{"name": "assemble", "ver": "v1"}, {"name": "blinds", "ver": "v1"}, {"name": "chroma", "ver": "v1"}, {"name": "crt", "ver": "v1"}, {"name": "engrave", "ver": "v1"}, {"name": "focus", "ver": "v1"}, {"name": "grain", "ver": "v1"}, {"name": "lantern", "ver": "v1"}, {"name": "mosaic", "ver": "v1"}, {"name": "pinwheel", "ver": "v1"}, {"name": "polarity", "ver": "v1"}, {"name": "ripple", "ver": "v1"}, {"name": "spark", "ver": "v1"}, {"name": "tide", "ver": "v1"}, {"name": "unroll", "ver": "v1"}, {"name": "accordion", "ver": "v2"}, {"name": "blueprint", "ver": "v2"}, {"name": "chevron", "ver": "v2"}, {"name": "colorize", "ver": "v2"}, {"name": "curtain", "ver": "v2"}, {"name": "diamond", "ver": "v2"}, {"name": "drop", "ver": "v2"}, {"name": "exposure", "ver": "v2"}, {"name": "float", "ver": "v2"}, {"name": "glitch", "ver": "v2"}, {"name": "heartbeat", "ver": "v2"}, {"name": "louver", "ver": "v2"}, {"name": "orbit", "ver": "v2"}, {"name": "pendulum", "ver": "v2"}, {"name": "posterize", "ver": "v2"}, {"name": "prism", "ver": "v2"}, {"name": "radar", "ver": "v2"}, {"name": "rings", "ver": "v2"}, {"name": "scanner", "ver": "v2"}, {"name": "shimmer", "ver": "v2"}, {"name": "slash", "ver": "v2"}, {"name": "sprint", "ver": "v2"}, {"name": "stamp", "ver": "v2"}, {"name": "typewriter", "ver": "v2"}, {"name": "zipper", "ver": "v2"}, {"name": "anvil", "ver": "v3"}, {"name": "book", "ver": "v3"}, {"name": "breathe-opacity", "ver": "v3"}, {"name": "carousel", "ver": "v3"}, {"name": "checker", "ver": "v3"}, {"name": "chisel", "ver": "v3"}, {"name": "chroma-v", "ver": "v3"}, {"name": "chrome-loop", "ver": "v3"}, {"name": "crosshair", "ver": "v3"}, {"name": "cyanotype", "ver": "v3"}, {"name": "domino", "ver": "v3"}, {"name": "duotone", "ver": "v3"}, {"name": "etch", "ver": "v3"}, {"name": "fan", "ver": "v3"}, {"name": "flashbulb", "ver": "v3"}, {"name": "frame", "ver": "v3"}, {"name": "glimmer", "ver": "v3"}, {"name": "hexagon", "ver": "v3"}, {"name": "holo", "ver": "v3"}, {"name": "horizon", "ver": "v3"}, {"name": "inkbleed", "ver": "v3"}, {"name": "laser-h", "ver": "v3"}, {"name": "marquee", "ver": "v3"}, {"name": "morse", "ver": "v3"}, {"name": "neon-loop", "ver": "v3"}, {"name": "orbit-loop", "ver": "v3"}, {"name": "parallax", "ver": "v3"}, {"name": "pendulum-loop", "ver": "v3"}, {"name": "pixel-step", "ver": "v3"}, {"name": "prism-loop", "ver": "v3"}, {"name": "sepia", "ver": "v3"}, {"name": "slingshot", "ver": "v3"}, {"name": "solarize", "ver": "v3"}, {"name": "sonar-loop", "ver": "v3"}, {"name": "spotlight", "ver": "v3"}, {"name": "spring", "ver": "v3"}, {"name": "staircase", "ver": "v3"}, {"name": "starburst", "ver": "v3"}, {"name": "static", "ver": "v3"}, {"name": "stencil", "ver": "v3"}, {"name": "thermal", "ver": "v3"}, {"name": "trapdoor", "ver": "v3"}, {"name": "tumble", "ver": "v3"}, {"name": "tunnel", "ver": "v3"}, {"name": "venetian", "ver": "v3"}, {"name": "vignette", "ver": "v3"}, {"name": "wave-h", "ver": "v3"}, {"name": "wave-loop", "ver": "v3"}, {"name": "wave-v", "ver": "v3"}, {"name": "xray", "ver": "v3"}];
    let nonce = 0;
    let currentFilter = 'all';
    let query = '';
    const grid = document.getElementById('grid');

    function render() {
      grid.innerHTML = '';
      const z = parseFloat(document.getElementById('zoom').value);
      const q = query.trim().toLowerCase();
      ITEMS.filter(it => (currentFilter === 'all' || it.ver === currentFilter) && (!q || it.name.includes(q)))
        .forEach(it => {
          const card = document.createElement('div');
          card.className = 'card';
          const file = it.name + '.svg';
          card.innerHTML = `
            <div class="stage"><img src="${file}?r=${++nonce}" alt="${it.name}" style="width:${300 * z}px;height:${110 * z}px" loading="lazy" /></div>
            <div class="meta">
              <span class="title">${it.name} <span class="badge ${it.ver}">${it.ver}</span></span>
              <button class="replay-one">Replay</button>
            </div>`;
          card.querySelector('.replay-one').onclick = () => {
            card.querySelector('img').src = file + '?r=' + (++nonce);
          };
          grid.appendChild(card);
        });
    }

    document.getElementById('search').oninput = e => { query = e.target.value; render(); };
    document.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentFilter = b.dataset.filter;
      render();
    });
    document.querySelectorAll('.stage-btn').forEach(b => b.onclick = () => {
      document.querySelectorAll('.stage-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.body.dataset.stage = b.dataset.stage;
    });
    document.getElementById('zoom').oninput = e => {
      const z = parseFloat(e.target.value);
      document.getElementById('zval').textContent = z + '×';
      document.querySelectorAll('.stage img').forEach(img => {
        img.style.width = (300 * z) + 'px';
        img.style.height = (110 * z) + 'px';
      });
    };
    document.getElementById('replay-all').onclick = () => {
      document.querySelectorAll('.stage img').forEach(img => {
        const base = img.getAttribute('src').split('?')[0];
        img.src = base + '?r=' + (++nonce);
      });
    };
    render();
  </script>
</body>
</html>
