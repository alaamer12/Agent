<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #6b645e; --line: #e4e0db; --card: #ffffff;
    --accent: #b45309; --code-bg: #f4f1ec; --bar: #b45309; --bar-bg: #ece7e1;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --fg: #efece8; --muted: #a39b93; --line: #2d2a27; --card: #1c1a18;
      --accent: #f59e0b; --code-bg: #121110; --bar: #f59e0b; --bar-bg: #2a2623;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
  .rec { margin: 22px 0 6px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 8px 8px 0; }
  section.option { margin-top: 28px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  section.option h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .tag { display: inline-block; font-family: var(--mono); font-size: .75rem; color: var(--accent); margin-right: 6px; }
  .concept { margin: 6px 0 12px; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 14px; font-size: .9rem; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .lanes { margin: 10px 0 16px; font-family: var(--mono); font-size: .8rem; }
  .lane { display: grid; grid-template-columns: 110px 1fr minmax(120px, auto); gap: 10px; align-items: center; margin: 4px 0; }
  .lane .bar { height: 10px; background: var(--bar-bg); border-radius: 3px; position: relative; }
  .lane .bar i { position: absolute; top: 0; bottom: 0; background: var(--bar); border-radius: 3px; }
  .lane .ltime { color: var(--muted); }
  figure.seq { margin: 16px 0 0; }
  figure.seq figcaption { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; font-weight: 600; }
  button, select { font: inherit; font-size: .85rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, iframe:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player { min-height: 3em; margin: 0 0 10px; padding: 12px; background: var(--code-bg); border: 1px dashed var(--accent); border-radius: 8px; font: 13px/1.25 var(--mono); overflow-x: auto; white-space: pre; }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .frame { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; }
  .frame.active { border-color: var(--accent); }
  .ft { font: 12px var(--mono); color: var(--accent); margin-bottom: 4px; }
  .ft .note { color: var(--muted); margin-left: 8px; }
  .frame pre { margin: 0; font: 13px/1.25 var(--mono); white-space: pre; }
  .demo { margin-top: 18px; }
  .demo iframe { width: 100%; min-height: 240px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  footer { margin-top: 36px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
<header>
  <h1>__TITLE__</h1>
  <p>__SUBTITLE__</p>
  <div class="meta">__META__</div>
</header>
__RECOMMENDATION__
__BODY__
<footer>Prototype generated outside the source tree. Nothing here ships. Pick an option, or ask for a remix.</footer>
</main>
<script>
(function () {
  function playSequence(fig) {
    var frames = JSON.parse(fig.getAttribute('data-frames'));
    var player = fig.querySelector('.player');
    var cards = fig.querySelectorAll('.frame');
    var speed = parseFloat(fig.querySelector('select').value) || 1;
    if (fig._timers) fig._timers.forEach(clearTimeout);
    fig._timers = [];
    frames.forEach(function (f, i) {
      fig._timers.push(setTimeout(function () {
        player.textContent = f.art;
        cards.forEach(function (c, j) { c.classList.toggle('active', i === j); });
      }, f.t / speed));
    });
  }
  document.querySelectorAll('figure.seq').forEach(function (fig) {
    var first = JSON.parse(fig.getAttribute('data-frames'))[0];
    fig.querySelector('.player').textContent = first ? first.art : '';
    fig.querySelector('button.play').addEventListener('click', function () { playSequence(fig); });
  });
  document.querySelectorAll('.demo').forEach(function (demo) {
    var frame = demo.querySelector('iframe');
    var send = function (msg) { if (frame.contentWindow) frame.contentWindow.postMessage(msg, '*'); };
    demo.querySelector('button.replay').addEventListener('click', function () { send({ type: 'replay' }); });
    var rev = demo.querySelector('button.reverse');
    if (rev) rev.addEventListener('click', function () { send({ type: 'reverse' }); });
    demo.querySelector('select').addEventListener('change', function (e) { send({ type: 'rate', value: parseFloat(e.target.value) }); });
  });
})();
</script>
</body>
</html>
