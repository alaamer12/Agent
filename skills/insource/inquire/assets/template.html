<!DOCTYPE html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#f3f6f8;--fg:#16212b;--mut:#53606d;--card:#fff;--line:#d9e0e6;--acc:#0e7490;--accbg:#e0f3f8;
--recbg:#dcfce7;--recfg:#146c35;--whybg:#e0f2fe;--whyfg:#07557e;--whyln:#38a6e0;--warnbg:#fef3c7;--warnfg:#8a4a07;--mbg:#ede9fe;--mfg:#5b21b6;--err:#b42318;--errbg:#fee4e2}
:root[data-theme=dark]{--bg:#0c1116;--fg:#e6edf3;--mut:#9fadba;--card:#141b22;--line:#273340;--acc:#5ad1ea;--accbg:#12323c;
--recbg:#12301f;--recfg:#86efac;--whybg:#0c2a3d;--whyfg:#8ad6fb;--whyln:#2b8fc7;--warnbg:#3a2a0a;--warnfg:#fcd34d;--mbg:#2a1f4d;--mfg:#c9b8ff;--err:#fda29b;--errbg:#3b1512}
html{font-size:clamp(17px,.5vw + 15px,21px);scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Lexend","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.75;letter-spacing:.01em}
main{max-width:62rem;margin:0 auto;padding:clamp(18px,4vw,56px) clamp(16px,4vw,40px) 17rem}
h1{font-size:clamp(1.8rem,2.4vw + 1rem,3rem);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.date{margin:0 0 28px;color:var(--mut)}
h2{line-height:1.3}
code{font:500 .88em "JetBrains Mono",ui-monospace,monospace;background:var(--accbg);color:var(--acc);padding:1px 6px;border-radius:6px}
mark{background:var(--warnbg);color:var(--warnfg);padding:0 4px;border-radius:4px;font-weight:500}
.ctx,.tldr,.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,2.6vw,34px);margin-bottom:clamp(20px,3vw,32px)}
.ctx h2,.tldr h2{margin:0 0 12px;font-size:1.3rem}
.ctx p{margin:0 0 14px;max-width:70ch}.ctx p:last-child{margin:0}
.tldr{border:2px solid var(--acc)}
.tldr ul{margin:0;padding-inline-start:1.2em}.tldr li{margin:4px 0}
.q.miss{border-color:var(--err);box-shadow:0 0 0 3px var(--errbg)}
.qh{display:flex;gap:14px;align-items:flex-start}
.n{display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:700;flex:none;font-size:.95rem}
.qh h2{margin:0;font-size:1.35rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.tag{font-size:.82rem;padding:2px 12px;border-radius:99px;background:var(--mbg);color:var(--mfg);font-weight:500}
.tag.hi{background:var(--warnbg);color:var(--warnfg)}
.about{margin:0 0 14px;max-width:70ch}
.why{margin:0 0 16px;padding:12px 16px;border-radius:12px;background:var(--whybg);color:var(--whyfg);border-inline-start:5px solid var(--whyln);font-size:.97rem}
.why b{display:block;font-size:.88rem;margin-bottom:2px}
details.terms{margin:0 0 16px;border:1px solid var(--line);border-radius:12px;padding:8px 16px}
details.terms summary{cursor:pointer;font-weight:600;font-size:.95rem;min-height:36px;display:flex;align-items:center}
details.terms dt{font-weight:600;margin-top:8px}details.terms dd{margin:0 0 8px;color:var(--mut);font-size:.95rem}
.vis{margin:0 0 18px;min-width:0}
.vis .cap{margin:6px 2px 0;color:var(--mut);font-size:.85rem}
pre{margin:0;padding:16px 18px;overflow-x:auto;border-radius:14px;background:#12151c;color:#d6dbe8;font:400 .9rem/1.7 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;tab-size:2}
.fn-name{display:inline-block;margin-bottom:6px;font:500 .85rem "JetBrains Mono",ui-monospace,monospace;color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:30rem;font-size:.93rem}
th,td{text-align:start;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-weight:600}tr:last-child td{border-bottom:0}
.opts{display:grid;gap:12px;margin:0;padding:0;border:0;min-width:0}
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;min-height:44px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--acc)}
.opt:has(input:checked){border-color:var(--acc);background:var(--accbg)}
.opt:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.opt input{margin:.35rem 0 0;width:1.2rem;height:1.2rem;accent-color:var(--acc);flex:none}
.ob{flex:1;min-width:0}
.ot{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.rec{font-size:.78rem;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--recbg);color:var(--recfg)}
.rk{font-size:.82rem;font-weight:400;color:var(--mut)}
.od{margin:2px 0 0;color:var(--mut);font-size:.95rem}
.ow{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--warnbg);color:var(--warnfg);font-size:.9rem}
.opt textarea{display:block;width:100%;margin-top:8px;min-height:4.5rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem;resize:vertical}
.opt textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.src{margin:14px 0 0;font-size:.85rem;color:var(--mut)}.src a{color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:12px clamp(16px,4vw,40px) calc(12px + env(safe-area-inset-bottom,0px))}
.bi{max-width:62rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.prog{flex:1 1 14rem;min-width:0}.prog span{font-size:.92rem;color:var(--mut)}
.pt{height:.5rem;margin-top:4px;background:var(--line);border-radius:99px;overflow:hidden}.pt i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
button.go{all:unset;cursor:pointer;padding:12px 28px;min-height:44px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;box-sizing:border-box}
:root[data-theme=dark] button.go{color:#0c1116}
button.go:focus-visible,button.cp:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button.go[disabled]{opacity:.6;cursor:default}
.res{margin-top:24px;padding:18px 22px;border-radius:16px;background:var(--recbg);color:var(--recfg)}
.res.bad{background:var(--warnbg);color:var(--warnfg)}.res p{margin:0 0 10px}
.res pre{max-height:20rem;font-size:.82rem}
button.cp{all:unset;cursor:pointer;margin-top:10px;padding:8px 16px;min-height:40px;border:1.5px solid currentColor;border-radius:10px;font-weight:600;box-sizing:border-box}
.err{color:var(--err);font-size:.9rem;margin:10px 0 0}
.ctx h3{margin:24px 0 8px;font-size:1.05rem}
.ctx .vis,.q .vis{margin:0 0 18px}
.opt[hidden]{display:none}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:10px;margin:10px 0 0}
.pc>div{padding:8px 12px;border-radius:10px;font-size:.9rem}.pc ul{margin:2px 0 0;padding-inline-start:1.1em}.pc b{font-size:.85rem}
.pro{background:var(--recbg);color:var(--recfg)}.con{background:var(--warnbg);color:var(--warnfg)}
.opt .vis{margin:10px 0 0}.opt pre{font-size:.8rem;padding:12px 14px}
.tag.fu{background:var(--recbg);color:var(--recfg)}
.vis h4{margin:0 0 8px;font-size:.95rem}.vis ul{margin:0;padding-inline-start:1.2em}
.br{display:grid;grid-template-columns:6rem 1fr 3rem;gap:10px;align-items:center;font-size:.93rem;padding:3px 0}
.bt{height:.9rem;background:var(--line);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bv{font:500 .85rem "JetBrains Mono",ui-monospace,monospace;text-align:end}
@media(max-width:560px){.qh{gap:10px}.n{width:1.9rem;height:1.9rem}.opt{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
form{position:relative}
.q{margin-inline-start:calc(var(--d,0)*clamp(14px,2.6vw,34px))}
.n{width:auto;min-width:2.2rem;padding:0 .65rem;border-radius:99px;font-variant-numeric:tabular-nums}
#lk{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#lk path{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:6 5}
#lk circle{fill:var(--acc)}#lk .ar{fill:var(--acc);stroke:none}
@media(max-width:560px){.q{margin-inline-start:calc(var(--d,0)*12px)}.n{min-width:1.9rem}}
.stp{margin:0;padding-inline-start:1.5em}.stp li{margin:10px 0}.stp li span{display:block;color:var(--mut);font-size:.93rem}
.inf{background:var(--whybg);color:var(--whyfg)}.neu{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.bar{box-shadow:0 -8px 28px rgba(0,0,0,.12)}
.sk{margin-top:10px}
button.sk-b{all:unset;cursor:pointer;padding:12px 22px;min-height:44px;border-radius:12px;border:1.5px solid var(--acc);color:var(--acc);font-weight:600;box-sizing:border-box}
button.sk-b:hover{background:var(--accbg)}button.sk-b:focus-visible{outline:3px solid var(--fg);outline-offset:2px}button.sk-b[disabled]{opacity:.6;cursor:default}
.skh{flex-basis:100%;margin:0;font-size:.8rem;color:var(--mut);line-height:1.4}
.sk{align-items:flex-end}
.sk textarea{flex:1 1 14rem;min-width:0;min-height:44px;max-height:9rem;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem;line-height:1.5;resize:none;display:block}
.sk textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}.sk textarea.bad{border-color:var(--err)}
.opt textarea{max-height:14rem;resize:none}
.cb{border-radius:14px;overflow:hidden;background:#12151c;border:1px solid #2a3042}
.cbh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 16px;background:#171b24;border-bottom:1px solid #2a3042;color:#9aa3b8;font:500 .85rem "JetBrains Mono",ui-monospace,monospace}
.cb pre{border-radius:0}
.cpy{all:unset;cursor:pointer;padding:6px 14px;min-height:36px;box-sizing:border-box;border:1px solid #3a4258;border-radius:8px;color:#d6dbe8;font:500 .85rem "Lexend",system-ui,sans-serif}
.cpy:hover{border-color:#7a86a8}.cpy:focus-visible{outline:3px solid #fff;outline-offset:2px}
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:#6b7794;font-style:italic}
.token.string,.token.char,.token.attr-value,.token.inserted{color:#a5e075}
.token.keyword,.token.atrule,.token.selector,.token.important{color:#ff7ab2}
.token.function,.token.class-name{color:#c4a2ff}
.token.number,.token.boolean,.token.constant,.token.symbol,.token.deleted{color:#ff9e64}
.token.tag,.token.builtin,.token.section{color:#6cb6ff}
.token.attr-name,.token.property,.token.key{color:#ffc66d}
.token.punctuation,.token.operator{color:#9aa3b8}
.token.variable,.token.regex{color:#e8c07d}
pre,code{direction:ltr;text-align:left}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;padding:0;border:0}.opts{grid-template-columns:minmax(0,1fr)}@media(max-height:720px){.skh{display:none}}.opt,.q,.ctx{min-width:0}.cb{direction:ltr}textarea{unicode-bidi:plaintext}
</style>
</head>
<body>
<main>
<h1 id="ttl"></h1>
<p class="date" id="dt"></p>
<section class="ctx" id="ctx"></section>
<section class="tldr" id="tldr"></section>
<form id="qs" novalidate></form>
<div id="res" aria-live="polite"></div>
</main>
<div class="bar"><div class="bi">
<div class="prog"><span id="pt"></span><div class="pt"><i id="pb"></i></div></div>
<button class="go" id="sub" type="button">Submit answers</button>
</div>
<div class="bi sk"><textarea id="skm" rows="1" aria-label="Message to the agent" placeholder="Not what you need? Tell the agent what to change, then skip"></textarea>
<button class="sk-b" id="skb" type="button">Skip With</button>
<p class="skh" id="skh">Enter skips. Shift+Enter adds a new line. Skipping sends your message and the answers so far, and the agent rethinks the questions.</p></div></div>

 o+='<label class="opt"><input type="'+it+'" name="'+q.id+'" value="c"><span class="ob"><span class="ot">'+E(U.own)+'</span><p class="od">'+E(multi?U.ownm:U.owns)+'</p><textarea rows="2" data-c="'+q.id+'" aria-label="'+E(U.ownaria)+'" placeholder="'+E(U.ph)+'"></textarea></span></label>';
 return'<section class="q" id="q-'+q.id+'" style="--d:'+DP[q.id]+'"><div class="qh"><span class="n"></span><h2>'+md(q.q)+'</h2></div>'+
 '<div class="tags"><span class="tag">'+E(multi?U.many:U.one)+'</span>'+(q.when?'<span class="tag fu">'+E(U.fu)+'</span>':"")+(q.hi?'<span class="tag hi">'+E(U.hi)+'</span>':"")+'</div>'+
 '<p class="about">'+md(q.about)+'</p>'+
 (q.why?'<p class="why"><b>'+E(U.why)+'</b>'+md(q.why)+'</p>':"")+
 (q.terms?'<details class="terms" open><summary>'+E(U.terms)+'</summary><dl>'+q.terms.map(function(t){return"<dt>"+md(t[0])+"</dt><dd>"+md(t[1])+"</dd>"}).join("")+'</dl></details>':"")+
 blocks(q.vis)+'<fieldset class="opts" style="border:0;padding:0;margin:0"><legend class="sr">'+E(q.q)+'</legend>'+o+'</fieldset>'+
 '<p class="err" hidden>'+E(U.pick)+'</p></section>';
}).join("");
form.insertAdjacentHTML("beforeend",'<svg id="lk" aria-hidden="true"></svg>');
var lk=document.getElementById("lk");

/* ---------- state, branching, session storage ---------- */
var KEY="inquire:"+D.title+":"+D.date,S={};
function ld(){try{S=JSON.parse(sessionStorage.getItem(KEY))||{}}catch(e){S={}}}
function sv(){try{sessionStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ins(q){return[].slice.call(form.querySelectorAll('input[name="'+q.id+'"]'))}
function ta(q){return form.querySelector('textarea[data-c="'+q.id+'"]')}
function read(q){var s=[],c=false;ins(q).forEach(function(i){if(i.checked&&!i.closest("label").hidden){if(i.value==="c")c=true;else s.push(+i.value)}});
 return{s:s,c:c,t:ta(q).value}}
function ok(r){return r.s.length>0||(r.c&&r.t.trim()!=="")}
function cond(c){if(!c)return true;
 if(c.all)return c.all.every(cond);if(c.any)return c.any.some(cond);if(c.not)return!cond(c.not);
 var a=A[c.q];if(!a)return false;
 if(c.custom)return a.c&&a.t.trim()!=="";
 return c.is.some(function(i){return a.s.indexOf(i)>-1})}
function vq(){return D.qs.filter(function(q){return!document.getElementById("q-"+q.id).hidden})}
function upd(){A={};
 D.qs.forEach(function(q){var b=document.getElementById("q-"+q.id),v=cond(q.when);b.hidden=!v;if(!v)return;
  var L=ins(q);q.opts.forEach(function(x,i){A[q.id]=read(q);L[i].closest("label").hidden=!cond(x.when)});
  A[q.id]=read(q)});
 num();draw();
 var v=vq(),d=v.filter(function(q){return ok(read(q))}).length;
 document.getElementById("pt").textContent=T("ans",d,v.length);
 document.getElementById("pb").style.width=(100*d/v.length)+"%";
 if(window.autosize)autosize.update(document.querySelectorAll("textarea"))}
function num(){var t=0,c={},path={};vq().forEach(function(q){var p=P[q.id],pp=p&&path[p],x;
 if(!pp){path[q.id]=[++t];x=t+".0"}else{c[p]=(c[p]||0)+1;path[q.id]=pp.concat(c[p]);x=path[q.id].join(".")}
 document.querySelector("#q-"+q.id+" .n").textContent=x})}
function draw(){var f=form.getBoundingClientRect(),h="";
 lk.setAttribute("width",f.width);lk.setAttribute("height",f.height);
 vq().forEach(function(q){var p=P[q.id];if(!p)return;
  var cr=document.getElementById("q-"+q.id).getBoundingClientRect(),pr=document.getElementById("q-"+p).getBoundingClientRect(),
   b=document.querySelector("#q-"+q.id+" .n").getBoundingClientRect(),
   X=function(r){return(rtl?r.right:r.left)-f.left},sg=rtl?-1:1,xv=(X(cr)+X(pr))/2,xe=X(cr),ye=b.top+b.height/2-f.top;
  links(q.when).filter(function(l){return l.q===p}).forEach(function(l){
   var i=form.querySelector('input[name="'+p+'"][value="'+l.i+'"]');
   if(!i||!i.checked||i.closest("label").hidden)return;
   var r=i.closest("label").getBoundingClientRect(),xs=X(r),ys=r.top+r.height/2-f.top;
   h+='<path d="M'+xs+' '+ys+'H'+xv+'V'+ye+'H'+(xe-sg*8)+'"/><circle cx="'+xs+'" cy="'+ys+'" r="4"/><path class="ar" d="M'+(xe-sg*9)+' '+(ye-5)+'L'+xe+' '+ye+'L'+(xe-sg*9)+' '+(ye+5)+'Z"/>'})});
 lk.innerHTML=h}
function restore(){D.qs.forEach(function(q){var r=S[q.id];if(!r)return;
 ins(q).forEach(function(i){i.checked=i.value==="c"?r.c:r.s.indexOf(+i.value)>-1});ta(q).value=r.t||""})}
function touch(q){var b=document.getElementById("q-"+q.id);b.classList.remove("miss");b.querySelector(".err").hidden=true;S[q.id]=read(q);sv();upd()}
ld();restore();upd();
if(window.autosize)autosize(document.querySelectorAll("textarea"));
window.addEventListener("resize",draw);window.addEventListener("load",draw);
if(window.ResizeObserver)new ResizeObserver(draw).observe(form);
D.qs.forEach(function(q){
 document.getElementById("q-"+q.id).addEventListener("change",function(){touch(q)});
 ta(q).addEventListener("input",function(){
  var c=form.querySelector('input[name="'+q.id+'"][value="c"]'),e=ta(q).value.trim()==="";
  if(!e)c.checked=true;else if(q.type==="multi")c.checked=false;
  touch(q)});
});

/* ---------- submit ---------- */
function collect(){return{title:D.title,date:D.date,skipped:false,answers:vq().map(function(q){var r=read(q);
 return{id:q.id,question:q.q,type:q.type,
  selected:r.s.map(function(i){return{option:q.opts[i].t,recommended:i===0,option_index:i}}),
  custom:r.c&&r.t.trim()?r.t.trim():null}})}}
var sub=document.getElementById("sub"),res=document.getElementById("res");
var cj=new ClipboardJS(".cpy",{text:function(t){return t.closest(".cb").querySelector("pre").textContent}});
cj.on("success",function(e){var b=e.trigger;b.textContent=U.copied;setTimeout(function(){b.textContent=U.copy},1600);e.clearSelection()});
cj.on("error",function(e){e.trigger.textContent=U.ctrlc});
function send(o,msg){var out=JSON.stringify(o,null,2),bs=[sub,skb];bs.forEach(function(b){b.disabled=true});
 fetch("/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:out})
 .then(function(r){if(!r.ok)throw 0;
  res.innerHTML='<div class="res"><p><b>'+E(msg)+'</b> '+E(U.close)+'</p></div>';})
 .catch(function(){bs.forEach(function(b){b.disabled=false});
  res.innerHTML='<div class="res bad"><p><b>'+E(U.nosrv)+'</b> '+E(U.nosrv2)+'</p>'+cbk(out,"json","answers.json")+'</div>';});
 res.scrollIntoView({block:"center"})}
var skb=document.getElementById("skb"),skm=document.getElementById("skm");
skm.value=S._msg||"";if(window.autosize)autosize.update(skm);
function skip(){var m=skm.value.trim();
 if(!m){skm.classList.add("bad");skm.focus();skm.placeholder=U.skneed;return}
 var o=collect();o.skipped=true;o.message=m;send(o,U.skipped)}
skb.addEventListener("click",skip);
skm.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();skip()}});
form.addEventListener("keydown",function(e){if(e.target.tagName==="TEXTAREA"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&!e.isComposing){e.preventDefault();sub.click()}});
skm.addEventListener("input",function(){skm.classList.remove("bad");S._msg=skm.value;sv()});

sub.addEventListener("click",function(){
 var bad=null;
 vq().forEach(function(q){var b=document.getElementById("q-"+q.id),g=!ok(read(q));
  b.classList.toggle("miss",g);b.querySelector(".err").hidden=!g;if(g&&!bad)bad=b});
 if(bad){bad.scrollIntoView({block:"center"});return}
 send(collect(),U.sent);
});
})();
