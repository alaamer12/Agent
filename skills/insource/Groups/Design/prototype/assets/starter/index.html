<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAV Intelligence · prototype gallery</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/_app.css">
  <style>
    /* gallery-only chrome (the gallery is the only place with UI about UI) */
    .gallery { display: grid; gap: var(--space-5); }
    .screen-card .preview-box { aspect-ratio: 1280 / 800; overflow: hidden; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--surface); position: relative; }
    .screen-card iframe { width: 1280px; height: 800px; border: 0; transform: scale(.55);
      transform-origin: top left; pointer-events: none; }
    .meta { display: flex; align-items: baseline; gap: var(--space-2); margin: var(--space-2) 0 4px; }
    .tag { font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
    .notes { color: var(--muted); font-size: var(--fs-sm); margin: 0 0 var(--space-2); }
    .strip { display: flex; gap: var(--space-1); flex-wrap: wrap; align-items: center; }
    .strip button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
      padding: 3px 12px; font: inherit; font-size: var(--fs-xs); cursor: pointer; color: var(--muted); }
    .strip button.on { border-color: var(--accent); color: var(--accent); }
    .set-notes { border-top: 1px solid var(--line); padding-top: var(--space-3); color: var(--muted); font-size: var(--fs-sm); }
  </style>
</head>
<body data-page="gallery">
  <noscript>This gallery requires JavaScript to render live previews.</noscript>
  <script type="module">
    import { FUNDS_GALLERY, DASH_GALLERY } from "/js/specs.js";
    // Gallery rule: chips are GENERATED from the page's own preview list in
    // specs.js — the same object that documents its component state trees.
    // This file never types state URLs by hand.
    const PAGES = [
      { url: "/funds", title: "Funds · NAV table", tag: "Tab 1 • primary screen",
        notes: "Every interactive component is a queryable state tree: the bottom sheet (?open=plain|selection|loading|error with ?loading=region and ?error=kind sub-states), the details modal + its subject id, filter/sort/search controls. Composable, bookmarkable, honest shimmer (only the declared region)." },
      { url: "/dashboard", title: "Dashboard", tag: "Tab 2 • aggregates",
        notes: "Tabs plus the refresh dropdown as its own component tree (?refresh=open|loading|done). No shimmer outside what actually reloads." },
    ];
    document.body.insertAdjacentHTML("beforeend", `<div class="app gallery"></div><section class="app set-notes">
      Set rules: tokens live in theme.css (single owner); URL mechanics in _app.js (single owner);
      component state trees in specs.js (single owner — the gallery chips prove it: remove a
      preview there and its chip disappears here with no gallery edit).</section>`);
    const g = document.body.querySelector(".gallery");
    const PREVIEWS = { "/funds": FUNDS_GALLERY, "/dashboard": DASH_GALLERY };
    for (const page of PAGES) {
      const card = document.createElement("section");
      card.className = "panel screen-card";
      card.innerHTML = `<div class="preview-box"><iframe src="${page.url}"></iframe></div>
        <div class="meta"><h3 style="margin:0">${page.title}</h3><span class="tag">${page.tag}</span></div>
        <p class="notes">${page.notes}</p>
        <div class="strip"></div>`;
      const strip = card.querySelector(".strip"), frame = card.querySelector("iframe");
      const open = document.createElement("a"); open.className = "navlink"; open.textContent = "Open screen";
      open.target = "_blank";
      let curIdx = 0;
      const previews = PREVIEWS[page.url];
      const set = i => {
        curIdx = i;
        const q = previews[i].query;
        frame.src = page.url + q;
        open.href = page.url + q;
        strip.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === i));
      };
      previews.forEach((p, i) => {
        const b = document.createElement("button");
        b.textContent = p.label; b.onclick = () => set(i);
        strip.append(b);
      });
      strip.append(open);
      set(0);
      g.append(card);
    }
  </script>
</body>
</html>
