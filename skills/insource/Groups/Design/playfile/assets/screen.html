<!DOCTYPE html>
<!-- playfile skeleton: one screen, fully self-contained. Double-click opens it; no build, no server.
     Match lang/dir/fonts/content-language to the PRODUCT (an Arabic product stays dir="rtl").
     Every state a reviewer needs is forceable by URL; the README Files table documents them. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>[App]: [Screen] — [wave]</title>
<!-- CDN without SRI is an accepted playfile policy for review artifacts only (throwaway, never ships,
     never handles real data) - and it is disclosed in every folder README's "CDN note". If a playfile wave
     ever becomes durable, it graduates to /prototype, where assets get pinned. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<style data-purpose="tokens">
  /* Law 3: role-named tokens; state color is truth and never follows brand/theme. */
  :root {
    --brand: #2E6FD1; --brand-ink: #245AB0; --brand-soft: #EAF1FC; --brand-on: #ffffff;
    --bg-app: #f4f6f9; --surface: #ffffff; --surface-2: #f8fafc;
    --ink-1: #101725; --ink-2: #4a5568; --ink-3: #8a94a6; --line: #e3e8ef;
    --ok: #2E9E6B; --warn: #C77700; --bad: #D14343;
  }
  html.dark {
    --brand: #6FA4E8; --brand-ink: #9CC1F0; --brand-soft: rgba(111,164,232,.14); --brand-on: #0b1626;
    --bg-app: #0f1724; --surface: #1c2534; --surface-2: #16202e;
    --ink-1: #eef2f7; --ink-2: #b9c2d0; --ink-3: #7e8899; --line: #2c3a4e;
    --ok: #4FBF8C; --warn: #E0A458; --bad: #F07878;
  }
  body { background: var(--bg-app); color: var(--ink-2); }
  .surface { background: var(--surface); border: 1px solid var(--line); }
  .brand-bg { background: var(--brand); color: var(--brand-on); }
  .ink1 { color: var(--ink-1); } .ink3 { color: var(--ink-3); }
</style>
</head>
<body class="min-h-screen">

  <!-- Real <a href> navigation between screens (Law: links are the flow). No menu chrome. -->
  <header class="surface flex items-center gap-4 px-6 py-3">
    <a href="./projects.html" class="underline ink1">← Projects</a>
    <span class="font-semibold ink1">[Screen name]</span>
    <span class="ml-auto flex gap-2">
      <a href="?state=error" class="text-sm underline">error</a>
      <a href="?state=empty" class="text-sm underline">empty</a>
      <a href="?filled=1" class="text-sm underline">filled</a>
      <button id="theme-toggle" class="text-sm underline">theme</button>
    </span>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <section id="screen" class="surface rounded-xl p-6 min-h-[320px]"><!-- render() owns this --></section>
    <p class="text-xs ink3 mt-4">All data on this page is illustrative design data. Review artifact —
      the product renders these states from its own tokens.</p>
  </main>

<script data-purpose="url-state">
  // The light URL-state contract: names ASCII, values via URLSearchParams only (Arabic-safe),
  // invalid values fall to defaults, click path == cold-URL path through one render().
  const params = new URLSearchParams(location.search);

  // Theme: param first, then remembered identity, then light; persist on toggle.
  const THEME_KEY = '[app]-theme';
  let theme = params.get('theme') || localStorage.getItem(THEME_KEY) || 'light';
  const applyTheme = () => { document.documentElement.classList.toggle('dark', theme === 'dark');
    if (!params.get('theme')) localStorage.setItem(THEME_KEY, theme); };
  document.getElementById('theme-toggle').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); };

  // ?filled is SEEDED — the same link must draw the same data forever. Never bare Math.random().
  const rng = (s => () => (s = (s * 1664525 + 1013904223) >>> 0, s / 4294967296))(
    parseInt(params.get('filled') || '0', 10) + 1);

  const state = ['ok', 'empty', 'loading', 'error'].includes(params.get('state'))
    ? params.get('state') : 'ok';                    // Rule 4: invalid → default, silently.

  const rows = n => Array.from({ length: n }, (_, i) => `
    <li class="py-3 border-b" style="border-color: var(--line)">
      <div class="ink1 font-medium">Item ${i + 1} — ${Math.round(rng() * 900 + 100)} units</div>
      <div class="text-sm ink3">${state === 'error' && i === 0
        ? '<span style="color:var(--bad)">Sync failed — retry pending</span>' : 'Updated a moment ago'}</div>
    </li>`).join('');

  function render() {                                   // one render path for URL and click alike
    const el = document.getElementById('screen');
    if (state === 'loading') { el.innerHTML =
      '<div class="animate-pulse space-y-3">' + '<div class="h-5 rounded" style="background:var(--surface-2)"></div>'.repeat(4) + '</div>';
    } else if (state === 'empty') { el.innerHTML =     // empty is a designed surface, not blank
      '<div class="text-center py-16"><p class="ink1 font-semibold">Nothing here yet</p>' +
      '<p class="text-sm ink3 mt-1">Create the first item to see it listed here.</p>' +
      '<button class="brand-bg rounded-lg px-4 py-2 mt-4">Create item</button></div>';
    } else if (state === 'error') { el.innerHTML =
      '<div class="py-10"><p class="font-semibold" style="color:var(--bad)">Could not load items</p>' +
      '<p class="text-sm ink3 mt-1">The request failed. This surface exists only because this request can actually fail.</p>' +
      '<button class="brand-bg rounded-lg px-4 py-2 mt-4">Retry</button></div>';
    } else {
      const n = params.get('filled') ? 12 + Math.floor(rng() * 8) : 3;   // sparse default, crowded filled
      el.innerHTML = '<ul>' + rows(n) + '</ul>';
    }
  }
  applyTheme();
  render();
</script>
</body>
</html>
